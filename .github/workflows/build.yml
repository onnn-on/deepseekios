name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: List project structure
      run: |
        ls -la
        find . -name "*.xcodeproj" -o -name "*.xcworkspace" | head -20
        echo "---"
        xcodebuild -project DeepSeek.xcodeproj -list

    - name: Resolve SPM packages
      run: |
        xcodebuild -resolvePackageDependencies -project DeepSeek.xcodeproj -scheme DeepSeek

    - name: Build iOS App
      run: |
        xcodebuild -project DeepSeek.xcodeproj \
          -scheme DeepSeek \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath build \
          -destination 'generic/platform=iOS' \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=""

    - name: Find built app
      run: |
        echo "=== Searching for .app ==="
        find build -name "*.app" -type d
        echo "=== Done ==="

    - name: Package IPA
      run: |
        APP_PATH=$(find build -name "DeepSeek.app" -type d | head -1)
        
        if [ -z "$APP_PATH" ]; then
          echo "No DeepSeek.app found, searching for any .app..."
          find build -name "*.app" -type d
          exit 1
        fi
        
        echo "Found app: $APP_PATH"
        
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/
        zip -r DeepSeek.ipa Payload
        rm -rf Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DeepSeek-iOS-IPA
        path: DeepSeek.ipa
        retention-days: 30
